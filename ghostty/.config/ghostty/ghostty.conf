sheel-integration = zsh
theme = "themes/catppuccin-mocha.conf"

# -----------------------------------------------------------------------------
# Fontes e UI mínima
# -----------------------------------------------------------------------------
font-family = "Adwaita Mono NerdFont Mono bOLD"     
font-size = 16
mouse-hide-while-typing = true     
scrollback-limit = 100_000

# -----------------------------------------------------------------------------
# Copiar / Colar simplificado
# -----------------------------------------------------------------------------
# "Smart Copy": Ctrl+C copia se seleção existe, senão SIGINT
keybind = "ctrl+c=copy_or_interrupt"
# Colar com clique direito
keybind = "button3=paste_from_clipboard"

# -----------------------------------------------------------------------------
# Ajustes Hyprland (classe GTK para mapeamento)
# -----------------------------------------------------------------------------
window-class = "com.example.ghostty"

