<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Set priority for symbol fonts -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Adwaita</family>  <!-- Your preferred regular font first -->
      <family>Symbols Nerd Font</family>
      <family>Font Awesome 6 Free</family>
      <family>Material Design Icons</family>
      <family>Symbola</family>
    </prefer>
  </alias>

  <!-- Regular font takes precedence for numbers -->
  <match target="pattern">
    <test name="family">
      <string>monospace</string>
    </test>
    <test name="charset">
      <charset>
        <int>0x30</int> <!-- 0 -->
        <int>0x31</int> <!-- 1 -->
        <int>0x32</int> <!-- 2 -->
        <int>0x33</int> <!-- 3 -->
        <int>0x34</int> <!-- 4 -->
        <int>0x35</int> <!-- 5 -->
        <int>0x36</int> <!-- 6 -->
        <int>0x37</int> <!-- 7 -->
        <int>0x38</int> <!-- 8 -->
        <int>0x39</int> <!-- 9 -->
      </charset>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Adwaita</string>
    </edit>
  </match>
</fontconfig>
