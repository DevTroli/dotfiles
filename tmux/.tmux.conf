# ================================
# CONFIGURAÇÃO TMUX ERGONÔMICA
# Otimizada para Neovim + Hyprland
# ================================

# --- CONFIGURAÇÕES BÁSICAS ---
# Terminal com suporte completo a cores (crucial para Neovim)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Prefix ergonômico - C-Space evita conflitos com Hyprland (que usa Super)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Recarregar configuração
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- OTIMIZAÇÕES DE PERFORMANCE ---
# ESC delay zero (essencial para Neovim modal editing)
set -sg escape-time 0
# Buffer de histórico generoso
set -g history-limit 50000
# Foco em eventos (Neovim autoread)
set -g focus-events on
# Status bar responsivo
set -g status-interval 2

# --- MOUSE INTELIGENTE ---
# Habilitado mas não intrusivo
set -g mouse on
# Não sair do copy mode ao selecionar
unbind -T copy-mode-vi MouseDragEnd1Pane

# Modo vi para navegação (compatível com Neovim)
set-window-option -g mode-keys vi

# --- SPLITS INTUITIVOS ---
# Vertical com ' (quote)
unbind %
bind "'" split-window -h -c "#{pane_current_path}"

# Horizontal com 's' (split)
unbind '"'
bind s split-window -v -c "#{pane_current_path}"

# Nova janela no diretório atual
bind c new-window -c "#{pane_current_path}"

# --- NAVEGAÇÃO SEM CONFLITOS ---
# Painéis: vim-tmux-navigator handles this automatically
# Apenas garantir que está habilitado
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Integração perfeita Tmux <-> Neovim
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

# Alternativa quando C-l está ocupado (clear screen)
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\' 'select-pane -l'

# *** CORREÇÃO 1: Janelas com Alt+number ***
# Estas bindings estavam corretas, mas vamos garantir que funcionem
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2  
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# *** CORREÇÃO 2: Navegação entre janelas (próxima/anterior) ***
# Adicionando os bindings que estavam faltando
bind n next-window
bind p previous-window

# Navegação rápida entre janelas (Alt+h/l também funciona)
bind -n M-h previous-window
bind -n M-l next-window

# --- REDIMENSIONAMENTO ERGONÔMICO ---
# Com prefix + Shift + hjkl (repeat habilitado)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5  
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# *** CORREÇÃO 3: Layout cycling com Space ***
# O binding correto para ciclar layouts com Ctrl+Space + Space
bind Space next-layout
# Adicionando também um binding para layout anterior
bind M-Space previous-layout

# --- COPY MODE INTEGRADO COM SYSTEM CLIPBOARD ---
# *** CORREÇÃO 4: Copy mode e clipboard ***
# Entrar em copy mode com prefix + v
bind v copy-mode

# Bindings estilo Vim no copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Para Wayland (wl-copy)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
# Para X11 (xclip) - descomente se necessário
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

bind-key -T copy-mode-vi Escape send-keys -X cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"

# *** CORREÇÃO 5: Colar do clipboard com prefix + p ***
# Comando para colar do clipboard do sistema
bind p run "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"
# Para X11 - descomente se necessário  
# bind p run "xclip -o -selection clipboard | tmux load-buffer - && tmux paste-buffer"

# Binding adicional para colar com Shift+Insert no copy mode
bind-key -T copy-mode-vi S-Insert send-keys -X copy-pipe-and-cancel "wl-copy"

# --- SESSÕES E JANELAS ---
# Renomear sem prefix (não conflita com Hyprland)
bind -n M-R command-prompt -I "#S" "rename-session '%%'"
bind -n M-W command-prompt -I "#W" "rename-window '%%'"

# Criar nova sessão
bind N command-prompt -p "Nova sessão:" "new-session -d -s '%%'"

# --- UTILITÁRIOS ERGONÔMICOS ---
# Matar painel/janela com confirmação
bind x confirm-before -p "Kill pane? (y/n)" kill-pane
bind X confirm-before -p "Kill window? (y/n)" kill-window

# Limpar tela e histórico
bind C-l send-keys 'clear' C-m \; clear-history

# Toggle sincronização de painéis
bind S set-window-option synchronize-panes \; display "Sync #{?synchronize-panes,ON,OFF}"

# Zoom toggle (fullscreen de painel)
bind f resize-pane -Z

# ================================
# TEMA CATPPUCCIN MOCHA GREEN
# ================================

# --- PALETA DE CORES CATPPUCCIN MOCHA ---
# Background colors
thm_bg="#1e1e2e"           # base
thm_bg_dark="#181825"      # mantle  
thm_bg_light="#313244"     # surface0
thm_bg_highlight="#585b70" # surface2

# Foreground colors
thm_fg="#cdd6f4"           # text
thm_fg_dim="#bac2de"       # subtext1
thm_fg_muted="#a6adc8"     # subtext0
thm_fg_dark="#6c7086"      # overlay1

# Accent colors (Catppuccin Mocha Green theme)
thm_accent="#a6e3a1"       # green (primary accent)
thm_blue="#89b4fa"         # blue  
thm_cyan="#94e2d5"         # teal
thm_purple="#cba6f7"       # mauve
thm_red="#f38ba8"          # red
thm_orange="#fab387"       # peach
thm_yellow="#f9e2af"       # yellow
thm_pink="#f5c2e7"         # pink

# --- STATUS BAR PRINCIPAL ---
set -g status-position top
set -g status-justify centre
set -g status-style "bg=$thm_bg,fg=$thm_fg"
set -g status-interval 2

# Comprimento das seções
set -g status-left-length 150
set -g status-right-length 100

# --- STATUS LEFT (Sessão + Diretório Completo) ---
set -g status-left "\
#[fg=$thm_bg,bg=$thm_accent,bold] 󰊠 #S \
#[fg=$thm_accent,bg=$thm_bg_light,nobold,nounderscore,noitalics]\
#[fg=$thm_cyan,bg=$thm_bg_light] 󰣇 \
#[fg=$thm_fg,bg=$thm_bg_light]#{s|$HOME|~|:pane_current_path} \
#[fg=$thm_bg_light,bg=$thm_bg,nobold,nounderscore,noitalics]\
#[fg=$thm_fg_dim,bg=$thm_bg] "

# --- STATUS RIGHT (Sistema + Tempo) ---
set -g status-right "\
#[fg=$thm_bg_light,bg=$thm_bg,nobold,nounderscore,noitalics]\
#[fg=$thm_cyan,bg=$thm_bg_light] 󰍛 #{cpu_percentage} \
#[fg=$thm_blue,bg=$thm_bg_light]󰘚 #{ram_percentage} \
#[fg=$thm_accent,bg=$thm_bg_light,nobold,nounderscore,noitalics]\
#[fg=$thm_bg,bg=$thm_accent,bold] 󰥔 %H:%M "

# --- FORMATO DAS JANELAS ---
# Janela inativa
set -g window-status-format "\
#[fg=$thm_bg,bg=$thm_bg_light,nobold,nounderscore,noitalics]\
#[fg=$thm_fg_dim,bg=$thm_bg_light] #I \
#[fg=$thm_fg_dim,bg=$thm_bg_light,nobold,nounderscore,noitalics] \
#[fg=$thm_fg_dim,bg=$thm_bg_light]#W \
#[fg=$thm_bg_light,bg=$thm_bg,nobold,nounderscore,noitalics]"

# Janela ativa
set -g window-status-current-format "\
#[fg=$thm_bg,bg=$thm_blue,nobold,nounderscore,noitalics]\
#[fg=$thm_bg,bg=$thm_blue,bold] #I \
#[fg=$thm_bg,bg=$thm_blue,nobold,nounderscore,noitalics] \
#[fg=$thm_bg,bg=$thm_blue,bold]#W \
#[fg=$thm_blue,bg=$thm_bg,nobold,nounderscore,noitalics]"

# Separadores de janelas
set -g window-status-separator ""

# --- BORDAS DOS PAINÉIS ---
set -g pane-border-style "fg=$thm_bg_highlight"
set -g pane-active-border-style "bg=default,fg=$thm_accent"

# Numeração dos painéis
set -g display-panes-colour "$thm_bg_highlight"
set -g display-panes-active-colour "$thm_accent"

# --- MENSAGENS E PROMPTS ---
set -g message-style "bg=$thm_orange,fg=$thm_bg"
set -g message-command-style "bg=$thm_orange,fg=$thm_bg"

# --- COPY MODE ---
set -g mode-style "bg=$thm_accent,fg=$thm_bg"

# --- NUMERAÇÃO E COMPORTAMENTO ---
# Começar do 1 (mais ergonômico)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Renumerar janelas automaticamente
set-option -g renumber-windows on

# Não renomear janelas automaticamente  
set-option -g allow-rename off

# --- CONFIGURAÇÕES AVANÇADAS ---
# Seleção de palavras inteligente
set -g word-separators ' @"=()[]{}:,.'
set -ag word-separators "'"

# Título da janela do terminal
set -g set-titles on
set -g set-titles-string "tmux: #S | #W"

# Atividade em outras janelas
set -g monitor-activity on
set -g visual-activity off

# --- SUPORTE AVANÇADO PARA NEOVIM ---
# Permitir passthrough de escape sequences
set -g allow-passthrough on

# Suporte a undercurl e cores especiais
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# --- PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'  
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'

# --- CONFIGURAÇÃO DO PLUGIN CPU ---
# Mostrar porcentagem total (padrão) ou por core
set -g @cpu_low_icon "="
set -g @cpu_medium_icon "≡"
set -g @cpu_high_icon "≣"
set -g @cpu_low_threshold "30"
set -g @cpu_medium_threshold "70"
# Intervalo de atualização (em segundos)
set -g @cpu_status_interval "2"

# --- CONFIGURAÇÃO DE PERSISTÊNCIA ---
# Restaurar conteúdo dos painéis
set -g @resurrect-capture-pane-contents 'on'
# Estratégia específica para Neovim
set -g @resurrect-strategy-nvim 'session'
# Auto-restore na inicialização
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- INICIALIZAR TPM ---
# Sempre manter no final do arquivo
run '~/.config/tmux/plugins/tpm/tpm'
